    <header>
        <img src="../images/logo-sized.png" alt="logo">
    </header>

    <main>
        <h2>Contact Form</h2>

        <div class="row">
            <div class="col">
                <h3>Address</h3>
                <address>801 University Ave<br>Syracuse, NY 13210</address>
            </div>
            <div class="col">
                <h3>Links</h3>
                <p><a href="mailto:acdurang@syr.edu">acdurang@syr.edu</a></p>
                <p><a href="https://www.linkedin.com/in/aaliyah-durango-0ba876238/">LinkedIn</a></p>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <form action="https://formspree.io/f/mqpakgqk" method="post">
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name"><br><br>

                    <label>Preferred contact method:</label><br>
                    <input type="radio" id="email" name="contact_method" value="email">
                    <label for="email">Email</label>
                    <input type="radio" id="phone" name="contact_method" value="phone">
                    <label for="phone">Phone</label><br><br>

                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30"></textarea><br><br>

                    <input type="submit" value="Submit">
                </form>
            </div>
            <div class="col">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2916.0104564822527!2d-76.13652982402432!3d43.04121149179741!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d9f3a03bae3315%3A0x317eaf5cce004671!2s801%20University%20Ave%2C%20Syracuse%2C%20NY%2013210!5e0!3m2!1sen!2sus!4v1790264020661!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
