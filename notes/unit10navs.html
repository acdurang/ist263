<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Notes</title>
    <style>
        nav{
            background-color: navy;
            padding: 10px;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
        }
        nav div {
            padding: 10px;
            display:flex;
        }
        .flexend{
            justify-content: flex-end;
        }
        .flexspacearound{
            justify-content: space-around;
        }
        .flexspacebetween{
            justify-content: space-between;
        }
        .splitnav{
            justify-content: space-between;
        }
        
    </style>
</head>
<body>
    <h1> Navigation </h1>

    <h2> Flex end </h2>
    <nav class="flexend">
        <div> Home</div>
        <div> About</div>
        <div> Products</div>
        <div> Contact</div>
    </nav>

     <h2> Flex space around </h2>
    <nav class="flexspacearound">
        <div> Home</div>
        <div> About</div>
        <div> Products</div>
        <div> Contact</div>
    </nav>

    <h2> Flex space between </h2>
    <nav class="flexspacebetween">
        <div> Home</div>
        <div> About</div>
        <div> Products</div>
        <div> Contact</div>
    </nav>

    <h2> Split Navigation </h2>
    <nav class="splitnav">
    <div>
        <div> Home</div>
        <div> About</div>
        <div> Products</div>
        <div> Contact</div>
    </div>
    <div>
        <div> Tiktok </div>
        <div> Instagram</div>

    </div>
    </nav>
</body>
</html>
