<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger</title>
    <style>
        #hamburger { width: 40px; }
        #hamburger img { width: 100%; }

        @media only screen and (min-width: 900px) {
            #hamburger { display: none; }
            #close { display: none; }
            #navitems { display: block !important; }
        }
        @media only screen and (max-width: 899px) {
            a { display: block; }
            #navitems { display: none; }
        }
    </style>
    <script>
        function showNav() {
            document.getElementById("navitems").style.display = "block";
        }
        function hideNav() {
            document.getElementById("navitems").style.display = "none";
        }
    </script>
</head>
<body>
    <div>
        <div id="hamburger" onclick="showNav()">
            <img src="https://laferger.github.io/ist263/images/hamburger.png" alt="Hamburger Icon">
        </div>
        <div id="close" onclick="hideNav()">X</div>
    </div>
    <nav id="navitems">
        <a href="">About</a>
        <a href="">Skills</a>
        <a href="">Contact</a>
    </nav>
</body>
</html>
